[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bpac-phon"
version = "0.1.0"
description = "Part D phonetic accent map for the Bangla Parallel Accent Corpus (BPAC)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "soundfile>=0.12",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.3",
    "regex>=2023.0",
    "tqdm>=4.65",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scipy>=1.10",
]

[tool.setuptools]
packages = ["bpac_phon"]
